<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Patitos Fortune — Round Lab Stamp / Ink</title>
  <desc id="desc">Approved M2 identity. Circular institutional seal, technical duck, lab name and EST. 2025. The date remains secondary.</desc>
  <circle cx="256" cy="256" r="238" fill="#F5F0E6" stroke="#102A36" stroke-width="2.4"/>
  <circle cx="256" cy="256" r="229" fill="none" stroke="#102A36" stroke-width="1"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#102A36" stroke-width="1.2"/>
  <defs>
    <path id="name-arc" d="M 56,256 A 200,200 0 0,1 456,256"/>
    <path id="lab-arc" d="M 56,256 A 200,200 0 0,0 456,256"/>
