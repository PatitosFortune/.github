    <text font-size="19" letter-spacing="2.8"><textPath href="#lab-arc" startOffset="50%">CREATIVE SOFTWARE LAB</textPath></text>
  </g>
  <g fill="#102A36" font-family="Consolas, 'Liberation Mono', monospace" font-size="16" letter-spacing="1" text-anchor="middle">
    <text x="65" y="260">EST.</text><text x="447" y="260">2025</text>
  </g>
  <svg x="96" y="96" width="320" height="320" viewBox="0 0 256 256">
<polygon id="duck-bill" points="198,70 220,86 166,86" fill="#102A36" />

