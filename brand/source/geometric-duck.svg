<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Patitos Fortune — geometric Impossible Duck</title>
  <desc id="desc">An angular right-facing duck constructed from ink, sage, paper, ochre and rust planes. A folded body meets an upright neck and a small ochre head.</desc>
  <!-- Canonical geometry. 256-unit artboard; silhouette bounds: 32,44 to 220,210.
       Palette: ink #102A36; paper #F5F0E6; sage #628580; ochre #C49449;
       rust #BA6041; slate #52616A. Local clipping and 0.5-unit facet overlaps prevent antialias seams. -->
  <defs>
    <path id="silhouette" d="M 32,114 L 80,118 124,122 154,136 136,86 139,66 148,54 166,44 188,50 198,70 220,86 166,86 196,124 196,166 160,210 86,210 42,166 Z"/>
    <clipPath id="duck-clip"><use href="#silhouette"/></clipPath>
  </defs>
  <g id="facets" clip-path="url(#duck-clip)" stroke-width="0.5" stroke-linejoin="round">
    <polygon id="tail" fill="#102A36" stroke="#102A36" points="32,114 80,118 42,166"/>
    <polygon id="wing" fill="#628580" stroke="#628580" points="80,118 124,168 86,210 42,166"/>
    <polygon id="back" fill="#F5F0E6" stroke="#F5F0E6" points="80,118 124,122 154,136 124,168"/>
    <polygon id="fold" fill="#BA6041" stroke="#BA6041" points="124,168 154,136 160,210"/>
    <polygon id="keel" fill="#102A36" stroke="#102A36" points="86,210 124,168 160,210"/>
    <polygon id="breast" fill="#102A36" stroke="#102A36" points="154,136 196,166 160,210"/>
    <polygon id="neck-front" fill="#102A36" stroke="#102A36" points="154,136 196,124 196,166"/>
    <polygon id="neck-plane" fill="#52616A" stroke="#52616A" points="166,86 196,124 154,136"/>
    <polygon id="neck-fold" fill="#628580" stroke="#628580" points="136,86 166,86 154,136"/>
    <polygon id="crown" fill="#102A36" stroke="#102A36" points="136,86 139,66 148,54 166,44 166,86"/>
    <polygon id="head" fill="#C49449" stroke="#C49449" points="166,44 188,50 198,70 166,86"/>
    <polygon id="bill" fill="#102A36" stroke="#102A36" points="198,70 220,86 166,86"/>
  </g>
  <!-- The eye is a locator, not an expression; optional to omit below 32 px. -->
  <circle id="eye" cx="178" cy="65" r="2.2" fill="#102A36"/>
</svg>
