<svg xmlns="http://www.w3.org/2000/svg" width="672" height="672" viewBox="0 0 672 672" role="img" aria-labelledby="title desc">
  <title id="title">Patitos Fortune — round seal construction study</title>
  <desc id="desc">Approved M2 expressive derivative. The clean Ochre-detail round seal stays intact. Quiet interior drafting and exterior registration arcs relate to its existing duck, center and 512-unit artboard. Approved expressive presentation.</desc>
  <rect width="672" height="672" fill="#F5F0E6" />
  <g id="exterior-registration" fill="none" stroke="#102A36" stroke-width="1.3">
    <path d="M 207.999999,114.297497 A 256,256 0 1 1 95.438689,423.557157" stroke-dasharray="2 4" stroke-width="1.5" opacity=".55" />
    <path d="M 24,336 H 648 M 336,24 V 648" stroke-dasharray="7 5 1 5" stroke-width="1" opacity=".32" />
    <path d="M 98,46 V 626 M 574,46 V 626" stroke="#AFBDB5" opacity=".9" stroke-width="1.1" />
    <path d="M 331,80 H 341 M 336,75 V 85" opacity=".45" stroke-width="1.1" />
    <path d="M 331,592 H 341 M 336,587 V 597" opacity=".45" stroke-width="1.1" />
    <path d="M 75,336 H 85 M 80,331 V 341" opacity=".45" stroke-width="1.1" />
    <path d="M 587,336 H 597 M 592,331 V 341" opacity=".45" stroke-width="1.1" />
  </g>
  <defs>
    <clipPath id="interior-clearance">
      <circle cx="256" cy="256" r="154" />
    </clipPath>
  </defs>
  <g id="clean-seal" transform="translate(80 80)">
    <circle cx="256" cy="256" r="238" fill="#F5F0E6" stroke="#102A36" stroke-width="2.4" />
    <circle cx="256" cy="256" r="229" fill="none" stroke="#102A36" stroke-width="1" />
    <circle cx="256" cy="256" r="164" fill="none" stroke="#C49449" stroke-width="1.2" />
    <defs>
      <path id="name-arc" d="M 56,256 A 200,200 0 0,1 456,256" />
      <path id="lab-arc" d="M 56,256 A 200,200 0 0,0 456,256" />
    </defs>
    <g fill="#102A36" font-family="'Segoe UI', Arial, Helvetica, sans-serif" text-anchor="middle">
      <text font-size="26" letter-spacing="4">
        <textPath href="#name-arc" startOffset="50%">PATITOS FORTUNE</textPath>
      </text>
      <text font-size="19" letter-spacing="2.8">
        <textPath href="#lab-arc" startOffset="50%">CREATIVE SOFTWARE LAB</textPath>
      </text>
    </g>
    <g fill="#102A36" font-family="Consolas, 'Liberation Mono', monospace" font-size="16" letter-spacing="1" text-anchor="middle">
      <text x="65" y="260">EST.</text>
      <text x="447" y="260">2025</text>
    </g>
    <g id="interior-drafting" clip-path="url(#interior-clearance)">
      <g transform="translate(96 96) scale(1.25)">
        <g id="drafting-guides" fill="none" stroke="#AFBDB5" stroke-width=".6" stroke-linecap="round">
          <circle cx="126" cy="127" r="92.135769" stroke="#102A36" opacity=".48" stroke-width="1" stroke-dasharray="4 2" />
          <path d="M 76,230.75 L 176,23.25" stroke-width=".65" opacity=".9" />
          <path d="M 126,25 V 231 M 17,127 H 258" stroke="#102A36" opacity=".40" stroke-dasharray="4 3 1 3" stroke-width=".8" />
          <path d="M 148,44 H 241 M 17,210 H 241 M 32,97 V 231 M 220,64 V 231" opacity=".82" stroke-width=".6" />
          <path d="M 204.633498,190.297779 A 74.242845,74.242845 0 0 1 119.145096,201.552541" stroke="#102A36" opacity=".38" stroke-width=".8" />
          <g stroke="#102A36" opacity=".4" stroke-width=".65">
            <path d="M 164,44 H 168 M 166,42 V 46" />
            <path d="M 84,210 H 88 M 86,208 V 212" />
            <path d="M 30,114 H 34 M 32,112 V 116" />
            <path d="M 218,86 H 222 M 220,84 V 88" />
            <path d="M 124,127 H 128 M 126,125 V 129" />
            <path d="M 152,136 H 156 M 154,134 V 138" />
            <path d="M 158,210 H 162 M 160,208 V 212" />
          </g>
        </g>
      </g>
    </g>
    <svg x="96" y="96" width="320" height="320" viewBox="0 0 256 256">
      <polygon id="duck-bill" points="198,70 220,86 166,86" fill="#C49449" />
      <g fill="none" stroke="#102A36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path id="duck-silhouette" d="M 32,114 L 80,118 124,122 154,136 136,86 139,66 148,54 166,44 188,50 198,70 220,86 166,86 196,124 196,166 160,210 86,210 42,166 Z" />
        <path id="duck-body-seams" d="M 42,166 L 80,118 124,168 86,210 M 124,168 L 154,136 160,210 M 124,168 L 160,210 M 154,136 L 196,166" />
        <path id="duck-neck-seams" d="M 136,86 L 166,86 154,136 196,124 M 166,86 L 166,44 M 166,86 L 198,70" />
        <path id="duck-body-brace" d="M 124,168 L 196,166" />
      </g>
      <circle id="duck-eye" cx="178" cy="65" r="2.2" fill="#102A36" />
      <g id="duck-pa-accent">
        <path id="duck-pa-left-leg" d="M 86,210 L 124,168 154,136" fill="none" stroke="#C49449" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        <path id="duck-pa-right-leg" d="M 154,136 L 160,210" fill="none" stroke="#C49449" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <path id="duck-pa-counter" d="M 124,168 L 154,136 156.521348,167.096629 Z" fill="none" stroke="#C49449" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </svg>
  </g>
  <path id="ochre-registration-marker" fill="#C49449" d="M 592,326 Q 592,336 602,336 Q 592,336 592,346 Q 592,336 582,336 Q 592,336 592,326 Z" />
</svg>
