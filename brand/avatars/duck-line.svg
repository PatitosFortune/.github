<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Patitos Fortune — Technical PA avatar</title>
  <desc id="desc">Approved M2 identity. Secondary technical avatar. Two non-PA seams omitted; strokes adapted to 4/4.6 units. Complete Ochre PA and bill retained.</desc>
<rect width="256" height="256" fill="#F5F0E6"/>
<polygon id="duck-bill" points="198,70 220,86 166,86" fill="#C49449" />

<g fill="none" stroke="#102A36" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path id="duck-silhouette" d="M 32,114 L 80,118 124,122 154,136 136,86 139,66 148,54 166,44 188,50 198,70 220,86 166,86 196,124 196,166 160,210 86,210 42,166 Z" />
    <path id="duck-body-seams" d="M 42,166 L 80,118 124,168 86,210 M 124,168 L 154,136 160,210" />
    <path id="duck-neck-seams" d="M 136,86 L 166,86 154,136 196,124 M 166,86 L 166,44 M 166,86 L 198,70" />
    <path id="duck-body-brace" d="M 124,168 L 196,166" />
  </g>

<circle id="duck-eye" cx="178" cy="65" r="2.2" fill="#102A36" />


<g id="duck-pa-accent">
    <path id="duck-pa-left-leg" d="M 86,210 L 124,168 154,136" fill="none" stroke="#C49449" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
    <path id="duck-pa-right-leg" d="M 154,136 L 160,210" fill="none" stroke="#C49449" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
    <path id="duck-pa-counter" d="M 124,168 L 154,136 156.521348,167.096629 Z" fill="none" stroke="#C49449" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

</svg>
